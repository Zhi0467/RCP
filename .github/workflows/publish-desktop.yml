name: Publish desktop

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag in vX.Y.Z form
        required: true
        type: string
      candidate_run:
        description: Desktop candidate run id whose tested app to publish; empty builds fresh
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      candidate_run:
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: publish-desktop-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  identity:
    name: check the promoted release
    # Runs after the server release is published, so a failure here leaves it
    # unchanged. A failed companion remains a draft and can be retried.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      build: ${{ steps.release.outputs.build }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Read the promoted release identity
        id: release
        shell: bash
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid release tag $RELEASE_TAG"
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/promoted-release.json"
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          release = json.loads((Path(os.environ["RUNNER_TEMP"]) / "promoted-release.json").read_text())
          commit = release["target_commitish"]
          if (release["draft"] or release["prerelease"]
              or release["tag_name"] != os.environ["RELEASE_TAG"]
              or not re.fullmatch(r"[0-9a-f]{40}", commit)):
              raise SystemExit("expected a published stable release with an exact commit")
          promotion = re.fullmatch(r"Promoted build ([0-9]+) from commit ([0-9a-f]{40})\.", release["body"].strip())
          if not promotion or promotion[2] != commit:
              raise SystemExit("release has no matching promoted build receipt")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"commit={commit}\nbuild={promotion[1]}\n")
              output.write(f"version={os.environ['RELEASE_TAG'][1:]}\n")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"TARGET_COMMIT={commit}\nBUILD_NUMBER={promotion[1]}\n")
          PY

      - name: Refuse a published companion and remove an existing draft
        shell: bash
        run: |
          # Listing also sees drafts; an API failure must not look like absence.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | {id, tag_name, draft} | @json' > "$RUNNER_TEMP/releases.jsonl"
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/desktop-$RELEASE_TAG" > "$RUNNER_TEMP/companion-refs.json"
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          tag = "desktop-" + os.environ["RELEASE_TAG"]
          releases = [json.loads(line) for line in (Path(os.environ["RUNNER_TEMP"]) / "releases.jsonl").read_text().splitlines()]
          refs = json.loads((Path(os.environ["RUNNER_TEMP"]) / "companion-refs.json").read_text())
          for ref in refs:
              if ref["ref"] == f"refs/tags/{tag}" and ref["object"]["sha"] != os.environ["TARGET_COMMIT"]:
                  raise SystemExit("existing companion tag points at a different commit")
          matches = [release for release in releases if release["tag_name"] == tag]
          if any(not release["draft"] for release in matches):
              raise SystemExit(f"published companion {tag} already exists")
          for release in matches:
              subprocess.run(["gh", "api", "--method", "DELETE", f"repos/{os.environ['GITHUB_REPOSITORY']}/releases/{release['id']}"], check=True)
          PY

  build:
    needs: [identity]
    if: inputs.candidate_run == ''
    uses: ./.github/workflows/build-desktop.yml
    with:
      commit: ${{ needs.identity.outputs.commit }}
      build: ${{ needs.identity.outputs.build }}
      version: ${{ needs.identity.outputs.version }}

  publish:
    name: publish unsigned desktop companion
    needs: [identity, build]
    # `build` is skipped when a tested candidate is published instead.
    if: >-
      !cancelled() && needs.identity.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      TARGET_COMMIT: ${{ needs.identity.outputs.commit }}
      BUILD_NUMBER: ${{ needs.identity.outputs.build }}
      DESKTOP_VERSION: ${{ needs.identity.outputs.version }}
      CANDIDATE_RUN: ${{ inputs.candidate_run }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Refuse a candidate run that is not a successful desktop candidate
        if: inputs.candidate_run != ''
        shell: bash
        run: |
          if ! [[ "$CANDIDATE_RUN" =~ ^[0-9]+$ ]]; then
            echo "invalid candidate run $CANDIDATE_RUN"
            exit 1
          fi
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN" --jq '[.path, .conclusion] | join(" ")')
          if [ "$run" != ".github/workflows/desktop-candidate.yml success" ]; then
            echo "run $CANDIDATE_RUN is not a successful desktop candidate: $run"
            exit 1
          fi
          # A rerun of the candidate uploads a second app, and the download
          # takes the newest; refuse rather than guess which one was tested.
          apps=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN/artifacts" --jq '[.artifacts[] | select(.name == "desktop-app")] | length')
          if [ "$apps" != "1" ]; then
            echo "run $CANDIDATE_RUN holds $apps desktop apps; dispatch a fresh candidate and test that"
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-app
          path: artifact
          run-id: ${{ inputs.candidate_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Check the artifact was built from this release's build
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          found = json.load(open("artifact/desktop-identity.json"))
          expected = {
              "commit": os.environ["TARGET_COMMIT"],
              "build": os.environ["BUILD_NUMBER"],
              "version": os.environ["DESKTOP_VERSION"],
          }
          if found != expected:
              raise SystemExit(f"desktop artifact identity {found} differs from {expected}")
          PY
          mv artifact/desktop-assets desktop-assets
          (cd desktop-assets && shasum -a 256 -c "RCP-$RELEASE_TAG-macos-arm64.zip.sha256")
          if [ -n "$CANDIDATE_RUN" ]; then
            echo "Published the tested app from desktop candidate run $CANDIDATE_RUN." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No candidate run was given; published an app built fresh in this run." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload a draft companion
        run: |
          gh release create "desktop-$RELEASE_TAG" desktop-assets/* \
            --draft --prerelease --latest=false \
            --target "$TARGET_COMMIT" \
            --title "RCP $RELEASE_TAG for Apple Silicon" \
            --notes "Unsigned macOS app for $RELEASE_TAG. Approve the first launch in System Settings > Privacy & Security > Open Anyway. Updates are manual."
      - name: Verify the uploaded bytes
        run: |
          mkdir downloaded-assets
          gh release download "desktop-$RELEASE_TAG" --dir downloaded-assets
          cmp "desktop-assets/RCP-$RELEASE_TAG-macos-arm64.zip.sha256" \
            "downloaded-assets/RCP-$RELEASE_TAG-macos-arm64.zip.sha256"
          cd downloaded-assets
          shasum -a 256 -c "RCP-$RELEASE_TAG-macos-arm64.zip.sha256"
      - name: Publish the verified companion
        run: gh release edit "desktop-$RELEASE_TAG" --draft=false --prerelease --latest=false

  report:
    name: report a desktop failure
    needs: [identity, build, publish]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - run: echo "Desktop publication failed; the server release is unchanged. Retry this workflow with the same tag." >> "$GITHUB_STEP_SUMMARY"
