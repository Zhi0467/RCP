name: Publish desktop

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag in vX.Y.Z form
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

concurrency:
  group: publish-desktop-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish unsigned desktop companion
    # Runs after the server release is published, so a failure here leaves it
    # unchanged. A failed companion remains a draft and can be retried.
    permissions:
      contents: write
    runs-on: macos-15
    outputs:
      commit: ${{ steps.release.outputs.commit }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Read the promoted release identity
        id: release
        shell: bash
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid release tag $RELEASE_TAG"
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/promoted-release.json"
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          release = json.loads((Path(os.environ["RUNNER_TEMP"]) / "promoted-release.json").read_text())
          commit = release["target_commitish"]
          if (release["draft"] or release["prerelease"]
              or release["tag_name"] != os.environ["RELEASE_TAG"]
              or not re.fullmatch(r"[0-9a-f]{40}", commit)):
              raise SystemExit("expected a published stable release with an exact commit")
          promotion = re.fullmatch(r"Promoted build ([0-9]+) from commit ([0-9a-f]{40})\.", release["body"].strip())
          if not promotion or promotion[2] != commit:
              raise SystemExit("release has no matching promoted build receipt")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"commit={commit}\n")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"TARGET_COMMIT={commit}\nBUILD_NUMBER={promotion[1]}\n")
          PY

      - name: Refuse a published companion and remove an existing draft
        shell: bash
        run: |
          # Listing also sees drafts; an API failure must not look like absence.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | {id, tag_name, draft} | @json' > "$RUNNER_TEMP/releases.jsonl"
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/desktop-$RELEASE_TAG" > "$RUNNER_TEMP/companion-refs.json"
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          tag = "desktop-" + os.environ["RELEASE_TAG"]
          releases = [json.loads(line) for line in (Path(os.environ["RUNNER_TEMP"]) / "releases.jsonl").read_text().splitlines()]
          refs = json.loads((Path(os.environ["RUNNER_TEMP"]) / "companion-refs.json").read_text())
          for ref in refs:
              if ref["ref"] == f"refs/tags/{tag}" and ref["object"]["sha"] != os.environ["TARGET_COMMIT"]:
                  raise SystemExit("existing companion tag points at a different commit")
          matches = [release for release in releases if release["tag_name"] == tag]
          if any(not release["draft"] for release in matches):
              raise SystemExit(f"published companion {tag} already exists")
          for release in matches:
              subprocess.run(["gh", "api", "--method", "DELETE", f"repos/{os.environ['GITHUB_REPOSITORY']}/releases/{release['id']}"], check=True)
          PY

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable

      - name: Check the desktop version and stamp the Python build
        run: |
          uv run --no-project python packaging/release_build.py check-desktop-version "${RELEASE_TAG#v}"
          uv run --no-project python packaging/release_build.py stamp-version \
            --run-number "$BUILD_NUMBER" --sha "$TARGET_COMMIT"
      - run: npm --prefix web ci
      - name: Build the app with the updater enabled
        env:
          RCP_UPDATE_ENDPOINT: https://github.com/Zhi0467/RCP/releases/download/mac-latest/latest.json
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "TAURI_SIGNING_PRIVATE_KEY is not set"; exit 1; }
          RCP_UPDATE_PUBKEY=$(cat web/src-tauri/updater.pub)
          export RCP_UPDATE_PUBKEY
          npm --prefix web run desktop:build-signed
      - name: Smoke-test the bundled backend
        run: uv run python packaging/smoke-backend.py web/src-tauri/target/release/bundle/macos/RCP.app/Contents/MacOS/rcp-backend
      - name: Verify the updater signature against the checked-in key
        # Before anything is published: a key mismatch must fail while the
        # companion can still be rebuilt.
        run: |
          brew install minisign
          bundle=web/src-tauri/target/release/bundle/macos
          base64 -d < web/src-tauri/updater.pub > "$RUNNER_TEMP/updater.pub"
          base64 -d < "$bundle/RCP.app.tar.gz.sig" > "$RUNNER_TEMP/updater.minisig"
          minisign -V -m "$bundle/RCP.app.tar.gz" -p "$RUNNER_TEMP/updater.pub" -x "$RUNNER_TEMP/updater.minisig"
      - name: Archive the app with macOS metadata
        run: |
          mkdir desktop-assets
          ditto -c -k --sequesterRsrc --keepParent \
            web/src-tauri/target/release/bundle/macos/RCP.app \
            "desktop-assets/RCP-$RELEASE_TAG-macos-arm64.zip"
          bundle=web/src-tauri/target/release/bundle/macos
          cp "$bundle/RCP.app.tar.gz" "desktop-assets/RCP-$RELEASE_TAG-macos-arm64.app.tar.gz"
          cp "$bundle/RCP.app.tar.gz.sig" "desktop-assets/RCP-$RELEASE_TAG-macos-arm64.app.tar.gz.sig"
          cd desktop-assets
          shasum -a 256 "RCP-$RELEASE_TAG-macos-arm64.zip" > "RCP-$RELEASE_TAG-macos-arm64.zip.sha256"
      - name: Upload a draft companion
        run: |
          gh release create "desktop-$RELEASE_TAG" desktop-assets/* \
            --draft --prerelease --latest=false \
            --target "$TARGET_COMMIT" \
            --title "RCP $RELEASE_TAG for Apple Silicon" \
            --notes "Unsigned macOS app for $RELEASE_TAG. Install it with the one-line command in the README. A manually downloaded zip needs one approval in System Settings > Privacy & Security > Open Anyway. Installed apps update from the app's Update button."
      - name: Verify the uploaded bytes
        run: |
          mkdir downloaded-assets
          gh release download "desktop-$RELEASE_TAG" --dir downloaded-assets
          cmp "desktop-assets/RCP-$RELEASE_TAG-macos-arm64.zip.sha256" \
            "downloaded-assets/RCP-$RELEASE_TAG-macos-arm64.zip.sha256"
          cmp "desktop-assets/RCP-$RELEASE_TAG-macos-arm64.app.tar.gz" \
            "downloaded-assets/RCP-$RELEASE_TAG-macos-arm64.app.tar.gz"
          cd downloaded-assets
          shasum -a 256 -c "RCP-$RELEASE_TAG-macos-arm64.zip.sha256"
      - name: Publish the verified companion
        run: gh release edit "desktop-$RELEASE_TAG" --draft=false --prerelease --latest=false
      - name: Report a desktop failure
        if: failure()
        run: echo "Desktop publication failed; the server release is unchanged. Retry this workflow with the same tag." >> "$GITHUB_STEP_SUMMARY"

  point-updater:
    name: point the Mac updater at this release
    # A separate job, so a failure here reruns alone ("Re-run failed jobs") from
    # the already-published companion instead of rebuilding it.
    needs: publish
    # One pointer update at a time across every tag; the manifest step also
    # refuses to replace a newer version, so a late older run cannot win.
    concurrency:
      group: mac-updater-pointer
      cancel-in-progress: false
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      TARGET_COMMIT: ${{ needs.publish.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish.outputs.commit }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
      - name: Download the published updater signature
        run: |
          mkdir updater
          gh release download "desktop-$RELEASE_TAG" --dir updater \
            --pattern "RCP-$RELEASE_TAG-macos-arm64.app.tar.gz.sig"
      - name: Write latest.json, refusing to point back at an older release
        run: |
          # An API failure must not look like a missing pointer release.
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/mac-latest" > "$RUNNER_TEMP/pointer.json" 2> "$RUNNER_TEMP/pointer.err"; then
            echo "POINTER_EXISTS=1" >> "$GITHUB_ENV"
          elif grep -q "HTTP 404" "$RUNNER_TEMP/pointer.err"; then
            echo "POINTER_EXISTS=0" >> "$GITHUB_ENV"
          else
            cat "$RUNNER_TEMP/pointer.err"
            exit 1
          fi
          previous=()
          if grep -q '"name": *"latest.json"' "$RUNNER_TEMP/pointer.json" 2>/dev/null; then
            gh release download mac-latest --pattern latest.json --output "$RUNNER_TEMP/previous.json"
            previous=(--previous "$RUNNER_TEMP/previous.json")
          fi
          app="RCP-$RELEASE_TAG-macos-arm64.app.tar.gz"
          uv run --no-project python packaging/release_build.py updater-manifest \
            --tag "$RELEASE_TAG" \
            --signature "updater/$app.sig" \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/desktop-$RELEASE_TAG/$app" \
            --output updater/latest.json \
            "${previous[@]}"
      - name: Publish latest.json on the fixed mac-latest pre-release
        run: |
          if [ "$POINTER_EXISTS" = 0 ]; then
            gh release create mac-latest --prerelease --latest=false \
              --target "$TARGET_COMMIT" \
              --title "RCP Mac updater pointer" \
              --notes "Holds latest.json for the Mac app's updater. To install RCP, use the latest desktop-vX.Y.Z release."
          fi
          gh release upload mac-latest updater/latest.json --clobber
