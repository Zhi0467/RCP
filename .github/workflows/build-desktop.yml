name: Build desktop

# The one place the unsigned macOS app is built, always with the updater
# enabled and its bundle signed with the updater key. A candidate run builds it for
# a human to test, and promotion can publish that same artifact.
on:
  workflow_call:
    inputs:
      commit:
        description: Full commit to build
        required: true
        type: string
      build:
        description: CI run number of the build/<N> prerelease at that commit
        required: true
        type: string
      version:
        description: Desktop version in X.Y.Z form
        required: true
        type: string
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: build unsigned desktop app
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      RCP_REQUIRE_SPEECH_ANALYZER: "1"
      TARGET_COMMIT: ${{ inputs.commit }}
      BUILD_NUMBER: ${{ inputs.build }}
      DESKTOP_VERSION: ${{ inputs.version }}
      ASSET: RCP-v${{ inputs.version }}-macos-arm64.zip
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.7"
          enable-cache: true
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable

      - name: Check the desktop version and stamp the Python build
        run: |
          uv run --no-project python packaging/release_build.py check-desktop-version "$DESKTOP_VERSION"
          uv run --no-project python packaging/release_build.py stamp-version \
            --run-number "$BUILD_NUMBER" --sha "$TARGET_COMMIT"
      - run: npm --prefix web ci
      - name: Build the app with the updater enabled
        env:
          RCP_UPDATE_ENDPOINT: https://github.com/Zhi0467/RCP/releases/download/mac-latest/latest.json
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "TAURI_SIGNING_PRIVATE_KEY is not set"; exit 1; }
          RCP_UPDATE_PUBKEY=$(cat web/src-tauri/updater.pub)
          export RCP_UPDATE_PUBKEY
          npm --prefix web run desktop:build-signed
      - name: Verify older-macOS weak imports
        env:
          RCP_DESKTOP_BINARY: web/src-tauri/target/release/bundle/macos/RCP.app/Contents/MacOS/rcp-desktop
        run: |
          python3 - <<'PYTHON'
          import os
          import re
          import subprocess

          binary = os.environ["RCP_DESKTOP_BINARY"]
          symbols = subprocess.check_output(["xcrun", "nm", "-m", "-u", binary], text=True)
          speech = [line for line in symbols.splitlines() if "(from Speech)" in line]
          legacy = ("_OBJC_CLASS_$_SFSpeechRecognizer ", "_OBJC_CLASS_$_SFSpeechAudioBufferRecognitionRequest ")
          modern = [line for line in speech if not any(name in line for name in legacy)]
          assert modern, "No SpeechAnalyzer imports found"
          strong = [line for line in modern if "weak external" not in line]
          loads = subprocess.check_output(["xcrun", "otool", "-l", binary], text=True)
          overlays = [block for block in loads.split("Load command ") if re.search(r"name .*libswift[^/]*\.dylib", block)]
          assert overlays, "No Swift dylib loads found"
          strong += [block for block in overlays if "cmd LC_LOAD_WEAK_DYLIB" not in block]
          assert not strong, "Strong imports break older macOS:\n" + "\n".join(strong)
          print(f"PASS: {len(modern)} modern Speech imports are weak; {len(overlays)} Swift dylib loads are weak")
          PYTHON
      - name: Smoke-test the bundled backend
        run: uv run python packaging/smoke-backend.py web/src-tauri/target/release/bundle/macos/RCP.app/Contents/MacOS/rcp-backend
      - name: Verify the updater signature against the signing key
        # Before anything is published: a key mismatch must fail while the
        # companion can still be rebuilt. During a key rotation the transition
        # release is signed with the old key, named by updater-signing.pub,
        # while the app ships the new key in updater.pub.
        run: |
          brew install minisign
          bundle=web/src-tauri/target/release/bundle/macos
          signing=web/src-tauri/updater.pub
          if [ -f web/src-tauri/updater-signing.pub ]; then
            signing=web/src-tauri/updater-signing.pub
          fi
          echo "Verifying with $signing"
          base64 -d < "$signing" > "$RUNNER_TEMP/updater.pub"
          base64 -d < "$bundle/RCP.app.tar.gz.sig" > "$RUNNER_TEMP/updater.minisig"
          minisign -V -m "$bundle/RCP.app.tar.gz" -p "$RUNNER_TEMP/updater.pub" -x "$RUNNER_TEMP/updater.minisig"
      - name: Archive the app with macOS metadata
        run: |
          mkdir desktop-assets
          ditto -c -k --sequesterRsrc --keepParent \
            web/src-tauri/target/release/bundle/macos/RCP.app \
            "desktop-assets/$ASSET"
          bundle=web/src-tauri/target/release/bundle/macos
          cp "$bundle/RCP.app.tar.gz" "desktop-assets/RCP-v$DESKTOP_VERSION-macos-arm64.app.tar.gz"
          cp "$bundle/RCP.app.tar.gz.sig" "desktop-assets/RCP-v$DESKTOP_VERSION-macos-arm64.app.tar.gz.sig"
          cd desktop-assets
          shasum -a 256 "$ASSET" > "$ASSET.sha256"
          # Kept beside the assets, never published: promotion checks it
          # before it releases a candidate someone tested.
          printf '{"commit": "%s", "build": "%s", "version": "%s"}\n' \
            "$TARGET_COMMIT" "$BUILD_NUMBER" "$DESKTOP_VERSION" > ../desktop-identity.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-app
          path: |
            desktop-assets/
            desktop-identity.json
          if-no-files-found: error
          retention-days: 14
