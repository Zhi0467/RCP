name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.11"
      # The hooks shell out to `uv run ruff` and `npm --prefix web exec prettier`,
      # so both toolchains have to be installed before pre-commit runs. The build
      # comes first because `uv sync` builds this package, and the wheel
      # force-includes web/dist — without it hatchling fails on a missing path.
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: uv sync
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  python:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      # web/dist is gitignored and the app serves it when present; the suite has a
      # test that depends on the SPA catch-all route being mounted.
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: uv sync
      - run: uv run pytest

  old-data-upgrade:
    name: old-data upgrade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: uv sync --frozen
      - run: uv run pytest tests/test_server_upgrade.py
        env:
          RCP_RUN_EXACT_BASE_UPGRADE: "1"

  web:
    name: web typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: npm --prefix web test

  build:
    name: build
    needs: [lint, python, old-data-upgrade, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install and build the web application
        run: |
          npm --prefix web ci
          npm --prefix web run build
      - name: Export locked dependencies
        run: |
          mkdir -p dist
          uv export --frozen --no-emit-project --format requirements-txt --output-file dist/requirements.lock.txt
      - name: Stamp the build version
        run: uv run --no-project python packaging/release_build.py stamp-version --run-number "${{ github.run_number }}" --sha "${{ github.sha }}"
      - name: Build the wheel
        run: uv build --wheel --out-dir dist
      - name: Remove the uv output marker
        run: rm -f dist/.gitignore
      - name: Write the asset manifest
        run: uv run --no-project python packaging/release_build.py write-manifest dist --output manifest.sha256
      - name: Publish the build prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          gh release create "build/${GITHUB_RUN_NUMBER}" dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "build ${GITHUB_RUN_NUMBER} (${SHORT_SHA})" \
            --notes "Commit: ${GITHUB_SHA}. CI run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
