name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Pull-request runs share one group per branch and cancel each other. Push runs
# on main each get their own group: GitHub keeps at most one pending run per
# group, so a shared group would drop the middle merge's build even with
# cancel-in-progress off.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.11"
      # The hooks shell out to `uv run ruff` and `npm --prefix web exec prettier`,
      # so both toolchains have to be installed before pre-commit runs. The build
      # comes first because `uv sync` builds this package, and the wheel
      # force-includes web/dist — without it hatchling fails on a missing path.
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: uv sync
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  python:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      # web/dist is gitignored and the app serves it when present; the suite has a
      # test that depends on the SPA catch-all route being mounted.
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      # `--locked` fails when uv.lock no longer matches pyproject.toml. Bare
      # `uv sync` re-resolves and rewrites it inside the runner, so a dependency
      # added without `uv lock` passed here and shipped a stale
      # requirements.lock.txt from the build job.
      - run: uv sync --locked
      # test_real_age_1x_encrypts_and_decrypts_the_archive skips without these,
      # so backup encryption was only ever exercised against the stub.
      - run: sudo apt-get update && sudo apt-get install -y age
      - run: uv run pytest

  old-data-upgrade-tests:
    name: old-data migration tests
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # Use the complete GitHub release catalog: tags alone also include builds
      # and versions that were never promoted. Discovery failures fail the job.
      - name: Fetch every published release tag
        run: |
          python -c 'from tests.server_upgrade_harness import published_release_tags; print("\n".join(published_release_tags()))' > "$RUNNER_TEMP/upgrade-release-tags"
          while IFS= read -r tag; do
            git fetch --no-tags --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
          done < "$RUNNER_TEMP/upgrade-release-tags"
          cat "$RUNNER_TEMP/upgrade-release-tags"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: uv sync --frozen
      # `-n0` opts out of the repository-wide `-n auto`: one file lands on one
      # worker under `--dist loadfile`, so the rest are started for nothing.
      - run: uv run pytest tests/test_server_upgrade.py -n0 --durations=0
        env:
          RCP_RUN_EXACT_BASE_UPGRADE: "1"

  installed-upgrade-candidate:
    name: package installed upgrade candidate
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.catalog.outputs.releases }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - id: catalog
        name: Discover every published stable release
        run: |
          python -c 'import json; from tests.server_upgrade_harness import published_release_tags; print("releases=" + json.dumps({"tag": published_release_tags()}))' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - name: Build production wheels in a disposable source copy
        run: |
          uv run --no-project python -m tests.server_upgrade_harness build-candidate \
            --output "$RUNNER_TEMP/installed-upgrade/candidate" \
            --run-number "$GITHUB_RUN_NUMBER" --sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installed-upgrade-candidate
          path: ${{ runner.temp }}/installed-upgrade
          if-no-files-found: error

  installed-upgrade-release:
    name: installed upgrade (${{ matrix.tag }})
    needs: installed-upgrade-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.installed-upgrade-candidate.outputs.releases) }}
    env:
      GH_TOKEN: ${{ github.token }}
      RCP_RUN_INSTALLED_UPGRADE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: installed-upgrade-candidate
          path: ${{ runner.temp }}/installed-upgrade
      - name: Download and verify promoted historical wheels
        env:
          RELEASE_TAG: ${{ matrix.tag }}
        run: |
          uv run --no-project python -m tests.server_upgrade_harness download-release \
            --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/installed-upgrade/base"
      - name: Install runner dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y age
          uv sync --frozen --no-install-project
          uv pip install --no-deps "$RUNNER_TEMP"/installed-upgrade/candidate/rcp-*.whl
      - name: Install the documented root-owned uv toolchain
        run: |
          RCP_UV_VERSION="0.12.7"
          RCP_UV_ARCHIVE="uv-x86_64-unknown-linux-gnu.tar.gz"
          RCP_UV_SHA256="788f18abea7c5f55d6216e4f5613fd89d4d59b631efeec117b2b07fe72f1da21"
          RCP_UV_DOWNLOAD_DIR="$(mktemp -d)"
          trap 'rm -rf "$RCP_UV_DOWNLOAD_DIR"' EXIT
          cd "$RCP_UV_DOWNLOAD_DIR"
          curl --fail --show-error --location --remote-name "https://releases.astral.sh/github/uv/releases/download/${RCP_UV_VERSION}/${RCP_UV_ARCHIVE}"
          printf '%s  %s\n' "$RCP_UV_SHA256" "$RCP_UV_ARCHIVE" | sha256sum --check --strict
          tar --extract --gzip --file "$RCP_UV_ARCHIVE"
          sudo install --directory --owner=root --group=root --mode=0755 /usr/local /usr/local/bin
          sudo install --owner=root --group=root --mode=0755 "uv-x86_64-unknown-linux-gnu/uv" /usr/local/bin/uv
          /usr/local/bin/uv --version
      - name: Exercise installed systemd update, rollback, backup, and retry
        env:
          RELEASE_TAG: ${{ matrix.tag }}
        run: |
          sudo --preserve-env=RCP_RUN_INSTALLED_UPGRADE,GITHUB_ACTIONS \
            "$PWD/.venv/bin/python" -m tests.server_installed_upgrade \
            --base "$RUNNER_TEMP/installed-upgrade/base" \
            --candidate "$RUNNER_TEMP/installed-upgrade/candidate" \
            --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/installed-upgrade/evidence"
      - name: Collect service logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/installed-upgrade/evidence"
          sudo journalctl -u rcp.service --no-pager > "$RUNNER_TEMP/installed-upgrade/evidence/service.log"
          # The supervisor names its error log in each refusal; keep them all and print them here.
          sudo cp -r /etc/rcp/supervisor/logs "$RUNNER_TEMP/installed-upgrade/evidence/supervisor-logs" || true
          sudo sh -c 'for f in /etc/rcp/supervisor/logs/*; do echo "== $f"; tail -c 4000 "$f"; done' || true
          sudo chmod -R a+rX "$RUNNER_TEMP/installed-upgrade/evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: installed-upgrade-${{ matrix.tag }}
          path: ${{ runner.temp }}/installed-upgrade/evidence
          if-no-files-found: error

  old-data-upgrade:
    # Preserve the existing required check name: installed failures cannot be
    # bypassed merely because branch protection has not learned a new job name.
    name: old-data upgrade
    needs: [old-data-upgrade-tests, installed-upgrade-candidate, installed-upgrade-release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every installed release journey
        env:
          MIGRATION_RESULT: ${{ needs.old-data-upgrade-tests.result }}
          CANDIDATE_RESULT: ${{ needs.installed-upgrade-candidate.result }}
          RELEASE_RESULT: ${{ needs.installed-upgrade-release.result }}
        run: test "$MIGRATION_RESULT" = success && test "$CANDIDATE_RESULT" = success && test "$RELEASE_RESULT" = success

  web:
    name: web typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      # The browser test needs a Chromium binary that npm ci does not fetch. Cache
      # it by lockfile so a run only downloads when the playwright version moves.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - run: npm --prefix web exec playwright -- install --with-deps chromium
      - run: npm --prefix web test

  build:
    name: build
    needs: [lint, python, old-data-upgrade, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Publish the exact wheel bytes exercised by every installed upgrade job.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: installed-upgrade-candidate
          path: qualified-build
      - name: Publish the build prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          gh release create "build/${GITHUB_RUN_NUMBER}" qualified-build/candidate/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "build ${GITHUB_RUN_NUMBER} (${SHORT_SHA})" \
            --notes "Commit: ${GITHUB_SHA}. CI run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
