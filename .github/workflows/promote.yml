name: Promote build

on:
  workflow_dispatch:
    inputs:
      build:
        description: Build run number
        required: true
        type: string
      tag:
        description: Release tag in vX.Y.Z form
        required: true
        type: string
      desktop_candidate_run:
        description: Desktop candidate run id whose tested app to publish; empty builds fresh
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  promote:
    name: promote build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ inputs.build }}
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.7"
          enable-cache: true
          python-version: "3.12"

      - name: Refuse an existing release or tag
        run: |
          if ! [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "invalid build number $BUILD_NUMBER"
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG already exists"
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "git tag $RELEASE_TAG already exists; gh release create would reuse its commit instead of the build's"
            exit 1
          fi

      - name: Download the build assets
        run: |
          mkdir build-assets
          if ! gh release download "build/$BUILD_NUMBER" --dir build-assets >/dev/null 2>&1; then
            echo "build release build/$BUILD_NUMBER does not exist"
            exit 1
          fi

      - name: Verify the build manifest
        run: uv run --no-project python packaging/release_build.py verify-manifest build-assets --manifest manifest.sha256

      # Historical builds have only the RCP wheel and lock; new builds must
      # carry both supervisor assets. A partial supervisor release is invalid.
      - name: Check the complete release asset set
        run: uv run --no-project python packaging/release_build.py check-assets build-assets

      - name: Check the promotion version
        run: uv run --no-project python packaging/release_build.py check-promotion --wheel build-assets/rcp-*.whl --tag "$RELEASE_TAG"

      - name: Read the build commit
        run: |
          if ! TARGET_COMMIT="$(gh release view "build/$BUILD_NUMBER" --json targetCommitish --jq .targetCommitish 2>/dev/null)"; then
            echo "could not read the commit for build/$BUILD_NUMBER"
            exit 1
          fi
          if ! [[ "$TARGET_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "build/$BUILD_NUMBER has an invalid target commit"
            exit 1
          fi
          echo "TARGET_COMMIT=$TARGET_COMMIT" >> "$GITHUB_ENV"

      - name: Create the promoted release
        run: |
          if ! gh release create "$RELEASE_TAG" build-assets/* \
            --target "$TARGET_COMMIT" \
            --latest \
            --title "$RELEASE_TAG" \
            --notes "Promoted build $BUILD_NUMBER from commit $TARGET_COMMIT." >/dev/null 2>&1; then
            echo "could not create release $RELEASE_TAG"
            exit 1
          fi
          TAG_COMMIT="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha 2>/dev/null || true)"
          if [[ "$TAG_COMMIT" != "$TARGET_COMMIT" ]]; then
            gh release delete "$RELEASE_TAG" --cleanup-tag --yes >/dev/null 2>&1 || true
            echo "release $RELEASE_TAG pointed at ${TAG_COMMIT:-nothing} instead of build commit $TARGET_COMMIT; it was removed again"
            exit 1
          fi

      - name: Prove the promoted asset bytes
        run: |
          mkdir promoted-assets
          if ! gh release download "$RELEASE_TAG" --dir promoted-assets >/dev/null 2>&1; then
            echo "could not download promoted release $RELEASE_TAG"
            exit 1
          fi
          if ! cmp -s build-assets/manifest.sha256 promoted-assets/manifest.sha256; then
            echo "promoted manifest.sha256 differs from build $BUILD_NUMBER"
            exit 1
          fi
          uv run --no-project python packaging/release_build.py verify-manifest \
            promoted-assets \
            --manifest "$PWD/build-assets/manifest.sha256"

  desktop:
    name: publish desktop companion
    needs: [promote]
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/publish-desktop.yml
    with:
      tag: ${{ inputs.tag }}
      candidate_run: ${{ inputs.desktop_candidate_run }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
