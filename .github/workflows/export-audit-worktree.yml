name: Export audit worktree

on:
  push:
    branches:
      - audit-remediation-2026-09-01

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: rcp-audit-worktree-${{ github.sha }}
          path: .
          include-hidden-files: true
          retention-days: 1
