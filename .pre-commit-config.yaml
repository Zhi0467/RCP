# Hooks run the repo's own pinned tools: ruff and basedpyright come from uv.lock,
# prettier and eslint from web/package-lock.json. Run `uv sync` and
# `npm --prefix web install` first.
#
#   uv run pre-commit install        # enable the hook
#   uv run pre-commit run --all-files

# `.research/` holds append-only patch files and materialized outputs (invariants
# 1 and 2 in AGENTS.md). No hook may rewrite them, not even for whitespace.
exclude: '(^|/)\.research/|^\.recovery/|^web/dist/'

repos:
  - repo: local
    hooks:
      # `uv run` below syncs this checkout's environment, which builds the
      # editable `rcp` install, and `pyproject.toml` force-includes `web/dist`.
      # A checkout that has never run the Web build (a fresh clone or a new
      # worktree) therefore fails inside hatchling with a long traceback that
      # scrolls past the later passing hooks. Fail first, in one line, instead.
      - id: web-dist-present
        name: web/dist present
        entry: "bash -c 'test -d web/dist || { echo \"web/dist is missing. Run: npm --prefix web ci && npm --prefix web run build\"; exit 1; }'"
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true
        fail_fast: true

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      # Whole-project check against `.basedpyright/baseline.json`; see the
      # `[tool.basedpyright]` note in pyproject.toml.
      - id: basedpyright
        name: basedpyright
        entry: uv run basedpyright
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true

      # Whole-tree count against `.ratchet/baseline.json`; the script's
      # docstring has the commands.
      - id: comment-ratchet
        name: comment ratchet
        entry: uv run python scripts/comment_ratchet.py
        language: system
        files: \.py$|^\.ratchet/baseline\.json$
        pass_filenames: false
        require_serial: true

      # React's hook rules and the comment ban; web/eslint.config.js explains
      # the scope. Comments are counted against web/eslint-suppressions.json;
      # after removing some, run `npm --prefix web run lint -- --prune-suppressions`.
      - id: eslint
        name: eslint
        entry: npm --prefix web run lint
        language: system
        files: ^web/(src|tests)/.*\.(ts|tsx|mjs)$|^web/(eslint\.config\.js|eslint-suppressions\.json)$
        pass_filenames: false
        require_serial: true

      - id: prettier
        name: prettier
        entry: npm --prefix web exec -- prettier --write --ignore-unknown
        language: system
        files: ^web/(src|tests)/.*\.(ts|tsx|mjs|css)$|^web/[^/]*\.(json|html|ts)$|^web/src-tauri/(capabilities/.*|[^/]+\.json)$
        # ESLint writes its own suppressions file.
        exclude: ^web/eslint-suppressions\.json$
        require_serial: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        # basedpyright and ESLint rewrite their baselines without a final newline.
        exclude: ^\.basedpyright/|^web/eslint-suppressions\.json$
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        # README recordings; the only binaries the repo carries on purpose.
        exclude: ^docs/media/
