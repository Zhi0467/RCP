<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DAG viewport regression</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React, { useRef, useState } from "react";
      import { createRoot } from "react-dom/client";
      import { DagView } from "/src/views/GraphViews.tsx";
      import "/src/styles.css";

      const graph = {
        revision: 1,
        nodes: Object.fromEntries(
          ["first", "second"].map((name) => {
            const id = `hyp/${name}`;
            return [
              id,
              {
                id,
                type: "hypothesis",
                title: name,
                statement: name,
                standing: "asserted",
                created_rev: 1,
                updated_rev: 1,
                source_refs: [],
                extension_fields: {},
              },
            ];
          }),
        ),
        edges: {},
        ontology: { types: [], fields: [], relations: [] },
        proposals: {},
        glossary: {},
        ambiguities: {},
        validation_messages: [],
        belief_transitions: [],
        replay_status: "complete",
        replay_failure: null,
      };

      if (new URLSearchParams(location.search).has("representative")) {
        const columns = [
          ["research_question", 2],
          ["hypothesis", 2],
          ["decision", 15],
          ["blocker", 4],
          ["experiment", 7],
          ["evidence", 12],
        ];
        graph.nodes = Object.fromEntries(
          columns.flatMap(([type, count]) =>
            Array.from({ length: count }, (_, index) => {
              const id = `${type}/${index}`;
              return [
                id,
                {
                  ...graph.nodes["hyp/first"],
                  id,
                  type,
                  title: `${type.replaceAll("_", " ")} ${index + 1}`,
                  status: type === "blocker" ? "open" : undefined,
                },
              ];
            }),
          ),
        );
        const edges = [
          ["research_question/0", "research_question/1", "has_subquestion"],
          ...Array.from({ length: 2 }, (_, index) => [
            `hypothesis/${index}`,
            "research_question/1",
            "addresses",
          ]),
          ...Array.from({ length: 15 }, (_, index) => [
            `experiment/${index % 7}`,
            `decision/${index}`,
            "governed_by",
          ]),
          ...Array.from({ length: 4 }, (_, index) => [
            `experiment/${index}`,
            `blocker/${index}`,
            "blocked_by",
          ]),
          ...Array.from({ length: 7 }, (_, index) => [
            `experiment/${index}`,
            `hypothesis/${index % 2}`,
            "tests",
          ]),
          ...Array.from({ length: 12 }, (_, index) => [
            `evidence/${index}`,
            `experiment/${index % 7}`,
            "result_of",
          ]),
        ];
        graph.edges = Object.fromEntries(
          edges.map(([source, target, relation], index) => {
            const id = `edge/${index}`;
            return [id, { id, source, target, relation, layer: "seam" }];
          }),
        );
      }

      if (new URLSearchParams(location.search).has("sparse")) {
        graph.nodes = {
          "evidence/0": {
            ...Object.values(graph.nodes)[0],
            id: "evidence/0",
            type: "evidence",
            title: "Pinned result",
          },
        };
        graph.edges = {};
      }

      function Fixture() {
        const viewport = useRef(null);
        const [visible, setVisible] = useState(true);
        return React.createElement(
          React.Fragment,
          null,
          React.createElement("button", { onClick: () => setVisible(!visible) }, "Toggle DAG"),
          visible &&
            React.createElement(DagView, {
              projectId: "fixture",
              graph,
              trustView: "working",
              viewportRef: viewport,
              onSelectNode: () => {},
            }),
        );
      }
      createRoot(document.getElementById("root")).render(React.createElement(Fixture));
    </script>
  </body>
</html>
