[package]
name = "rcp-desktop"
version = "0.3.2"
description = "Desktop entrance for Research Control Panel"
authors = ["RCP contributors"]
edition = "2021"

[lib]
name = "rcp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "rcp-desktop"
path = "src/main.rs"

[features]
# Q11 experiment: compiles the app-scoped TLS trust hook for the local-HTTPS
# origin probe. Off by default so no shipped build contains it.
https-trust-probe = []

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
plist = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["sync", "time"] }
tempfile = "3"
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
security-framework-sys = "2.17"

[profile.dev]
# `tauri build --debug` keeps debug_assertions, which RCP Dev.app needs to launch
# the backend from the checkout. The debug symbols are separable, and dropping
# them keeps target/debug from growing several GB per dev bundle.
debug = 0

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
