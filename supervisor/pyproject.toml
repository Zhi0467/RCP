[project]
name = "rcp-supervisor"
dynamic = ["version"]
description = "Independent release supervisor for RCP servers"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rcp-supervisor = "rcp_supervisor.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rcp_supervisor"]

[tool.hatch.version]
path = "src/rcp_supervisor/__init__.py"
