[project]
name = "rcp"
dynamic = ["version"]
description = "RCP: a human comprehension surface for agent-driven research projects"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28.1",
  "fastapi>=0.116.0",
  "python-multipart>=0.0.20",
  # 2.12 is the first release where Field(exclude_if=...) is honoured; on
  # 2.11 it is accepted and ignored, which would serialize the optional server
  # step fields as null and change a stored transition digest.
  "pydantic>=2.12.0",
  "tomlkit>=0.13.3",
  "uvicorn[standard]>=0.35.0",
  "anyio>=4.0",
  "markdown-it-py>=4.2.0",
  "pillow>=12.3.0",
  "cryptography>=45",
  "pycrdt==0.14.10",
]

[project.scripts]
rcp = "rcp.__main__:main"

[dependency-groups]
dev = [
  "basedpyright>=1.40.2",
  "http-ece>=1.2.1",
  "pre-commit>=4.0",
  "pyinstaller>=6.21.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "pytest-cov>=7.1.0",
  "pytest-xdist>=3.6.0",
  "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rcp"]
exclude = [
  "src/rcp/skills/graph-audit",
  "src/rcp/skills/evidence-triage",
  "src/rcp/skills/experiment-causality",
  "src/rcp/skills/episode-report",
  "src/rcp/skills/live-pages",
  "src/rcp/skills/workflows",
]

[tool.hatch.build.targets.wheel.force-include]
"web/dist" = "rcp/web_dist"
"src/rcp/skills/graph-audit" = "rcp/skills/graph-audit"
"src/rcp/skills/evidence-triage" = "rcp/skills/evidence-triage"
"src/rcp/skills/experiment-causality" = "rcp/skills/experiment-causality"
"src/rcp/skills/episode-report" = "rcp/skills/episode-report"
"src/rcp/skills/live-pages" = "rcp/skills/live-pages"
"src/rcp/skills/workflows" = "rcp/skills/workflows"

[tool.hatch.version]
path = "src/rcp/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["supervisor/src"]
# The suite is setup-bound rather than assertion-bound: roughly 3,400 tests each
# build their own SQLite store, data directory, and TestClient app, so wall time
# scales with worker count. `--dist loadfile` keeps one file's tests on one
# worker, which bounds the fixture churn and keeps a failure reproducible with a
# plain single-file run. Pass `-n0` to debug serially.
addopts = "-q --strict-markers -n auto --dist loadfile"
markers = [
  "real_provider_discovery: exercise the real provider discovery helper; only for a test that replaces `PATH` and the OS account home itself, in every process it runs",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  "web/dist",
  "web/node_modules",
  "web/src-tauri/gen",
  "web/src-tauri/target",
]

# Python shipped as source to hosts whose python3 may be 3.9.
# tests/test_shipped_sources.py derives the set and checks this list.
[tool.ruff.per-file-target-version]
"src/rcp/agents/grant_paths.py" = "py39"
"src/rcp/agents/memory_file_io.py" = "py39"
"src/rcp/agents/staged_command_broker.py" = "py39"
"src/rcp/agents/staged_command_client.py" = "py39"
"src/rcp/agents/staged_hidden_read.py" = "py39"
"src/rcp/artifact_preview.py" = "py39"
"src/rcp/browser/host.py" = "py39"
"src/rcp/browser/libraries.py" = "py39"
"src/rcp/browser/worker.py" = "py39"
"src/rcp/git_access.py" = "py39"
"src/rcp/git_identity.py" = "py39"
"src/rcp/providers/*/remote.py" = "py39"
"src/rcp/providers/codex/homes.py" = "py39"
"src/rcp/providers/session_format.py" = "py39"
"src/rcp/providers/turn_fence.py" = "py39"
"src/rcp/rcp_home.py" = "py39"
"src/rcp/regular_file_reader.py" = "py39"
"src/rcp/regular_tree_reader.py" = "py39"
"src/rcp/repository_window.py" = "py39"
"src/rcp/server_ops/provider_cleanup.py" = "py39"
"src/rcp/server_ops/remote_*.py" = "py39"
"src/rcp/sources/record_parsing.py" = "py39"
"src/rcp/terminals/git_access.py" = "py39"
"src/rcp/terminals/profile.py" = "py39"
"src/rcp/transport/compute_process_owner.py" = "py39"
"src/rcp/transport/conversation_worktree.py" = "py39"
"src/rcp/transport/provider_discovery.py" = "py39"
"src/rcp/transport/remote_*.py" = "py39"
"src/rcp/transport/watcher_process.py" = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

# Type checking. `standard` is pyright's default strictness; basedpyright's own
# default adds many stricter rules. Errors that predate the checker live in
# `.basedpyright/baseline.json`, and a run fails only on errors outside it. A
# plain run also deletes fixed errors from the baseline, so commit the shrunk
# file. Never run `--writebaseline` to silence a new error: it adds every
# current error back.
[tool.basedpyright]
include = ["src/rcp"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
